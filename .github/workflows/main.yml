name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All website files are present"

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build website package
        run: |
          mkdir build
          cp index.html style.css script.js build/
          echo "Website packaged successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/
